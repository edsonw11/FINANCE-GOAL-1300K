# CI: the same gate as `npm run check`, plus a dependency audit. No secrets are used.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: build, and fail if dist/ is not the build of src/
        run: npm run build && git diff --exit-code -- dist/
      - name: end-to-end and phone widths (headless Chrome of the runner)
        run: npm run test:e2e && npm run test:mobile

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.7-alpine3.24
        env:
          POSTGRES_USER: everfox
          POSTGRES_DB: everfox
          POSTGRES_PASSWORD: ci_only_password # a throwaway database that lives as long as this job
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U everfox -d everfox"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://everfox:ci_only_password@127.0.0.1:5432/everfox
      # the throwaway Keycloak started below (same realm file as local development)
      APP_BASE_URL: http://localhost:3000
      OIDC_ISSUER: http://localhost:8081/realms/everfox
      OIDC_CLIENT_ID: everfox-web
      OIDC_CLIENT_SECRET: everfox-dev-client-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: apply the migrations to an empty database
        run: npm run db:migrate
      - name: start Keycloak (the real identity provider, with the development realm)
        working-directory: .
        run: docker compose up -d --wait --wait-timeout 180 keycloak
      - name: integration tests (real PostgreSQL, real Keycloak, built program)
        run: npm run test:integration
