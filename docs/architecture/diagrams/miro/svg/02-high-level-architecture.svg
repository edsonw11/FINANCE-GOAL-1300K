<text x="438" y="766" font-family="Helvetica,Arial,sans-serif" font-size="11">routes.</text>
<text x="438" y="782" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">backend/src/plans/plans.module.ts &gt;</text>
<text x="438" y="795" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">PlansModule</text>
