<text x="438" y="607" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Auth</text>
<text x="438" y="625" font-family="Helvetica,Arial,sans-serif" font-size="11">OIDC login, cookie sessions, who am I.</text>
