<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1879" viewBox="0 0 1120 1879"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a5568"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="20" y="32" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold">Everfox: High-Level Architecture</text>
<text x="20" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555">One code base for the rules (src/core and src/domain), used by the browser app and, on the server, by the API.</text>
<rect x="20" y="96" width="300" height="339" fill="#fff" stroke="#9aa4b2"/><rect x="20" y="96" width="300" height="36" fill="#f8f9fb" stroke="#9aa4b2"/>
<text x="170" y="119" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Clients</text>
<rect x="40" y="152" width="260" height="122" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="48" y="170" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Browser app</text>
<text x="48" y="188" font-family="Helvetica,Arial,sans-serif" font-size="11">Plain ES modules (index.html + src/), or</text>
<text x="48" y="202" font-family="Helvetica,Arial,sans-serif" font-size="11">the single-file build in dist/. Keeps</text>
<text x="48" y="216" font-family="Helvetica,Arial,sans-serif" font-size="11">its data in the browser.</text>
<text x="48" y="232" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">src/app.js &gt; bindNavigation</text>
<text x="48" y="247" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="40" y="294" width="260" height="121" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="48" y="312" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Android shell</text>
<text x="48" y="330" font-family="Helvetica,Arial,sans-serif" font-size="11">Capacitor 8 around the same page, with</text>
<text x="48" y="344" font-family="Helvetica,Arial,sans-serif" font-size="11">its own CSP, offline, app lock.</text>
<text x="48" y="360" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">android/app/src/main/java/com/everfox/</text>
<text x="48" y="373" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">app/MainActivity.java &gt; MainActivity</text>
<text x="48" y="388" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="410" y="96" width="300" height="1184" fill="#fff" stroke="#9aa4b2"/><rect x="410" y="96" width="300" height="36" fill="#f8f9fb" stroke="#9aa4b2"/>
<text x="560" y="119" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">API (NestJS 12 on Fastify 5)</text>
<rect x="430" y="152" width="260" height="135" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
<text x="438" y="170" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Security layer</text>
<text x="438" y="188" font-family="Helvetica,Arial,sans-serif" font-size="11">Rate limits, CSRF by origin, login</text>
<text x="438" y="202" font-family="Helvetica,Arial,sans-serif" font-size="11">check, plan and admin guards, security</text>
<text x="438" y="216" font-family="Helvetica,Arial,sans-serif" font-size="11">headers.</text>
<text x="438" y="232" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">backend/src/security/security.module.ts</text>
<text x="438" y="245" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">&gt; SecurityModule</text>
<text x="438" y="260" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="430" y="307" width="260" height="121" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
<text x="438" y="325" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Web</text>
<text x="438" y="343" font-family="Helvetica,Arial,sans-serif" font-size="11">Serves the browser app files (an</text>
<text x="438" y="357" font-family="Helvetica,Arial,sans-serif" font-size="11">allow-list of src/ and vendor/).</text>
<text x="438" y="373" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">backend/src/web/web.module.ts &gt;</text>
<text x="438" y="386" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">WebModule</text>
<text x="438" y="401" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="430" y="448" width="260" height="121" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
<text x="438" y="466" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Health</text>
<text x="438" y="484" font-family="Helvetica,Arial,sans-serif" font-size="11">Live and ready checks (ready asks the</text>
<text x="438" y="498" font-family="Helvetica,Arial,sans-serif" font-size="11">database).</text>
<text x="438" y="514" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">backend/src/health/health.module.ts &gt;</text>
<text x="438" y="527" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">HealthModule</text>
<text x="438" y="542" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
