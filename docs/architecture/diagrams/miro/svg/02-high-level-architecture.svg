<text x="438" y="922" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">&gt; AccountsModule</text>
<text x="438" y="937" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
