<text x="26" y="476" font-family="Helvetica,Arial,sans-serif" font-size="10">API and entry</text>
<rect x="180" y="459" width="150" height="26" rx="5" fill="#d5e8d4" stroke="#82b366"/>
<text x="186" y="476" font-family="Helvetica,Arial,sans-serif" font-size="10">Processing and domain rules</text>
<rect x="340" y="459" width="150" height="26" rx="5" fill="#fff2cc" stroke="#d6b656"/>
<text x="346" y="476" font-family="Helvetica,Arial,sans-serif" font-size="10">Decisions and validations</text>
<rect x="500" y="459" width="150" height="26" rx="5" fill="#ffffff" stroke="#333333"/>
<text x="506" y="476" font-family="Helvetica,Arial,sans-serif" font-size="10">Results and outputs</text>
<text x="20" y="507" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555">Status values: IMPLEMENTED | PARTIAL | NOT CONFIRMED | NOT IDENTIFIED | LEGACY | PROPOSAL | MOCK. Colours are a convention, not an implementation status.</text></svg>
