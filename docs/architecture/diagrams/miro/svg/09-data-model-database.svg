<text x="26" y="1284" font-family="Helvetica,Arial,sans-serif" font-size="10">Infrastructure</text>
<rect x="180" y="1267" width="150" height="26" rx="5" fill="#d5e8d4" stroke="#82b366"/>
<text x="186" y="1284" font-family="Helvetica,Arial,sans-serif" font-size="10">Processing and domain rules</text>
<rect x="340" y="1267" width="150" height="26" rx="5" fill="#e1d5e7" stroke="#9673a6"/>
<text x="346" y="1284" font-family="Helvetica,Arial,sans-serif" font-size="10">Orchestration and services</text>
<text x="20" y="1315" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555">Status values: IMPLEMENTED | PARTIAL | NOT CONFIRMED | NOT IDENTIFIED | LEGACY | PROPOSAL | MOCK. Colours are a convention, not an implementation status.</text>
<text x="20" y="1337" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555">Records use an index on (user_id, version) for the changes after a cursor. The API database role only reads and writes data; migrations run with another role (backend/prisma/roles/grants.sql).</text></svg>
