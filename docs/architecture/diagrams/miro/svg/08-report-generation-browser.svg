<text x="26" y="575" font-family="Helvetica,Arial,sans-serif" font-size="10">API and entry</text>
<rect x="180" y="558" width="150" height="26" rx="5" fill="#d5e8d4" stroke="#82b366"/>
<text x="186" y="575" font-family="Helvetica,Arial,sans-serif" font-size="10">Processing and domain rules</text>
<rect x="340" y="558" width="150" height="26" rx="5" fill="#e1d5e7" stroke="#9673a6"/>
<text x="346" y="575" font-family="Helvetica,Arial,sans-serif" font-size="10">Orchestration and services</text>
