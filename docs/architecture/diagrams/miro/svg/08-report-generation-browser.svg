<text x="506" y="575" font-family="Helvetica,Arial,sans-serif" font-size="10">Results and outputs</text>
<text x="20" y="606" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555">Status values: IMPLEMENTED | PARTIAL | NOT CONFIRMED | NOT IDENTIFIED | LEGACY | PROPOSAL | MOCK. Colours are a convention, not an implementation status.</text></svg>
