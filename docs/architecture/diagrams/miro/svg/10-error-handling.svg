<text x="560" y="119" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Sync (web app)</text>
<rect x="430" y="152" width="260" height="122" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
<text x="438" y="170" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Offline, 401 or server error</text>
<text x="438" y="188" font-family="Helvetica,Arial,sans-serif" font-size="11">The api client turns it into offline,</text>
<text x="438" y="202" font-family="Helvetica,Arial,sans-serif" font-size="11">unauthorized or server; the outbox stays</text>
<text x="438" y="216" font-family="Helvetica,Arial,sans-serif" font-size="11">as it is and the run stops.</text>
<text x="438" y="232" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">src/sync/api-client.js &gt; createApiClient</text>
<text x="438" y="247" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="430" y="294" width="260" height="136" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
<text x="438" y="312" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">A mutation is rejected</text>
<text x="438" y="330" font-family="Helvetica,Arial,sans-serif" font-size="11">unknown resource, invalid data or not</text>
<text x="438" y="344" font-family="Helvetica,Arial,sans-serif" font-size="11">found: it goes to the review list and</text>
<text x="438" y="358" font-family="Helvetica,Arial,sans-serif" font-size="11">the batch stops; later ones are skipped</text>
<text x="438" y="372" font-family="Helvetica,Arial,sans-serif" font-size="11">and sent again.</text>
<text x="438" y="388" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">src/sync/runner.js &gt; review</text>
<text x="438" y="403" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="430" y="450" width="260" height="136" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
<text x="438" y="468" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Retries and back-off</text>
<text x="438" y="486" font-family="Helvetica,Arial,sans-serif" font-size="11">No automatic retry loop or back-off</text>
<text x="438" y="500" font-family="Helvetica,Arial,sans-serif" font-size="11">timer was found: a run is started by the</text>
<text x="438" y="514" font-family="Helvetica,Arial,sans-serif" font-size="11">app, and a failed run leaves the outbox</text>
<text x="438" y="528" font-family="Helvetica,Arial,sans-serif" font-size="11">for the next one.</text>
<text x="438" y="544" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">src/sync/runner.js &gt; createSync</text>
<text x="438" y="559" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: NOT IDENTIFIED</text>
<rect x="800" y="96" width="300" height="1002" fill="#fff" stroke="#9aa4b2"/><rect x="800" y="96" width="300" height="36" fill="#f8f9fb" stroke="#9aa4b2"/>
<text x="950" y="119" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">On the API</text>
<rect x="820" y="152" width="260" height="135" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="828" y="170" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">400 invalid input</text>
<text x="828" y="188" font-family="Helvetica,Arial,sans-serif" font-size="11">Bodies and parameters are checked</text>
<text x="828" y="202" font-family="Helvetica,Arial,sans-serif" font-size="11">against a schema; the answer names the</text>
<text x="828" y="216" font-family="Helvetica,Arial,sans-serif" font-size="11">field and the kind of problem.</text>
<text x="828" y="232" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">backend/src/http/parse-input.ts &gt;</text>
<text x="828" y="245" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">parseInput</text>
<text x="828" y="260" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="820" y="307" width="260" height="149" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="828" y="325" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">401 not logged in</text>
<text x="828" y="343" font-family="Helvetica,Arial,sans-serif" font-size="11">Every route needs a login unless marked</text>
<text x="828" y="357" font-family="Helvetica,Arial,sans-serif" font-size="11">public; unknown, expired or idle</text>
<text x="828" y="371" font-family="Helvetica,Arial,sans-serif" font-size="11">sessions are refused (and idle ones</text>
<text x="828" y="385" font-family="Helvetica,Arial,sans-serif" font-size="11">deleted).</text>
<text x="828" y="401" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">backend/src/auth/auth.guard.ts &gt;</text>
<text x="828" y="414" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">AuthGuard</text>
<text x="828" y="429" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="820" y="476" width="260" height="151" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="828" y="494" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">403 CSRF, locked feature, not</text>
<text x="828" y="510" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">admin</text>
<text x="828" y="528" font-family="Helvetica,Arial,sans-serif" font-size="11">A write must come from the app's own</text>
<text x="828" y="542" font-family="Helvetica,Arial,sans-serif" font-size="11">origin with the CSRF header; a locked</text>
<text x="828" y="556" font-family="Helvetica,Arial,sans-serif" font-size="11">feature answers code feature_locked.</text>
<text x="828" y="572" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">backend/src/auth/csrf.guard.ts &gt;</text>
<text x="828" y="585" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">CsrfGuard</text>
<text x="828" y="600" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="820" y="647" width="260" height="149" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="828" y="665" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">429 too many requests</text>
<text x="828" y="683" font-family="Helvetica,Arial,sans-serif" font-size="11">Fixed-window counters in memory, by</text>
<text x="828" y="697" font-family="Helvetica,Arial,sans-serif" font-size="11">address and by person; the answer has</text>
<text x="828" y="711" font-family="Helvetica,Arial,sans-serif" font-size="11">retryAfterSeconds. Per instance: several</text>
<text x="828" y="725" font-family="Helvetica,Arial,sans-serif" font-size="11">instances count separately.</text>
<text x="828" y="741" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">backend/src/security/rate-limit.guard.ts</text>
<text x="828" y="754" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">&gt; RateLimit</text>
<text x="828" y="769" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
