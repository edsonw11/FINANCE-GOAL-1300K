<text x="828" y="852" font-family="Helvetica,Arial,sans-serif" font-size="11">1 MB for every route, 25 MB for the</text>
<text x="828" y="866" font-family="Helvetica,Arial,sans-serif" font-size="11">whole-state import.</text>
<text x="828" y="882" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">backend/src/create-app.ts &gt;</text>
<text x="828" y="895" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">BODY_LIMIT_BYTES</text>
<text x="828" y="910" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="820" y="957" width="260" height="121" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="828" y="975" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">503 login unavailable</text>
<text x="828" y="993" font-family="Helvetica,Arial,sans-serif" font-size="11">The identity provider could not be</text>
<text x="828" y="1007" font-family="Helvetica,Arial,sans-serif" font-size="11">reached to start a login.</text>
<text x="828" y="1023" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">backend/src/auth/auth.controller.ts &gt;</text>
<text x="828" y="1036" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">ServiceUnavailableException</text>
