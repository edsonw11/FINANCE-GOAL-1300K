<text x="20" y="32" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold">Everfox: Error Handling</text>
<text x="20" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555">Only behaviour found in the code. A failure with no entry here has no specific handling.</text>
<rect x="20" y="96" width="300" height="824" fill="#fff" stroke="#9aa4b2"/><rect x="20" y="96" width="300" height="36" fill="#f8f9fb" stroke="#9aa4b2"/>
<text x="170" y="119" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">On the device</text>
<rect x="40" y="152" width="260" height="138" rx="8" fill="#f8cecc" stroke="#b85450"/>
<text x="48" y="170" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Saving fails (storage full,</text>
<text x="48" y="186" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">private mode)</text>
<text x="48" y="204" font-family="Helvetica,Arial,sans-serif" font-size="11">transact() undoes the change and returns</text>
<text x="48" y="218" font-family="Helvetica,Arial,sans-serif" font-size="11">false; the person is told, nothing</text>
<text x="48" y="232" font-family="Helvetica,Arial,sans-serif" font-size="11">half-saved.</text>
<text x="48" y="248" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">src/domain/store.js &gt; transact</text>
<text x="48" y="263" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="40" y="310" width="260" height="136" rx="8" fill="#f8cecc" stroke="#b85450"/>
<text x="48" y="328" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Stored data cannot be read</text>
<text x="48" y="346" font-family="Helvetica,Arial,sans-serif" font-size="11">It is copied to a .broken key, never</text>
<text x="48" y="360" font-family="Helvetica,Arial,sans-serif" font-size="11">overwritten; a blank state is used; a</text>
<text x="48" y="374" font-family="Helvetica,Arial,sans-serif" font-size="11">notice offers to restore yesterday's</text>
<text x="48" y="388" font-family="Helvetica,Arial,sans-serif" font-size="11">copy.</text>
<text x="48" y="404" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">src/domain/state-recovery.js &gt; readState</text>
<text x="48" y="419" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="40" y="466" width="260" height="151" rx="8" fill="#f8cecc" stroke="#b85450"/>
<text x="48" y="484" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Import file too big, wrong</text>
<text x="48" y="500" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">type or unreadable</text>
<text x="48" y="518" font-family="Helvetica,Arial,sans-serif" font-size="11">A plain message with the limit; photos</text>
<text x="48" y="532" font-family="Helvetica,Arial,sans-serif" font-size="11">and scans are refused; nothing is</text>
<text x="48" y="546" font-family="Helvetica,Arial,sans-serif" font-size="11">written.</text>
<text x="48" y="562" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">src/domain/import-reader.js &gt;</text>
<text x="48" y="575" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">IMPORT_LIMITS</text>
<text x="48" y="590" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="40" y="637" width="260" height="122" rx="8" fill="#f8cecc" stroke="#b85450"/>
<text x="48" y="655" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Backup cannot leave the phone</text>
<text x="48" y="673" font-family="Helvetica,Arial,sans-serif" font-size="11">A cancelled share sheet is not an error</text>
<text x="48" y="687" font-family="Helvetica,Arial,sans-serif" font-size="11">and is not counted as a backup; a write</text>
<text x="48" y="701" font-family="Helvetica,Arial,sans-serif" font-size="11">failure is told and not counted.</text>
<text x="48" y="717" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">src/ui/native-bridge.js &gt; shareTextFile</text>
<text x="48" y="732" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="40" y="779" width="260" height="121" rx="8" fill="#f8cecc" stroke="#b85450"/>
<text x="48" y="797" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Phone lost its screen lock</text>
<text x="48" y="815" font-family="Helvetica,Arial,sans-serif" font-size="11">The app opens and switches its lock off</text>
<text x="48" y="829" font-family="Helvetica,Arial,sans-serif" font-size="11">with a message: no lock-out.</text>
<text x="48" y="845" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">src/ui/app-lock/app-lock.js &gt;</text>
<text x="48" y="858" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">createAppLock</text>
<text x="48" y="873" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
