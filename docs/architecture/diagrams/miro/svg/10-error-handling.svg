<text x="1340" y="119" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Operation</text>
<rect x="1210" y="152" width="260" height="135" rx="8" fill="#f5f5f5" stroke="#666666"/>
<text x="1218" y="170" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Database not ready</text>
<text x="1218" y="188" font-family="Helvetica,Arial,sans-serif" font-size="11">/health/ready answers not ready when the</text>
<text x="1218" y="202" font-family="Helvetica,Arial,sans-serif" font-size="11">database does not answer within the</text>
<text x="1218" y="216" font-family="Helvetica,Arial,sans-serif" font-size="11">timeout; /health/live stays up.</text>
<text x="1218" y="232" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">backend/src/health/health.service.ts &gt;</text>
<text x="1218" y="245" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">HealthService</text>
<text x="1218" y="260" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="1210" y="307" width="260" height="135" rx="8" fill="#f5f5f5" stroke="#666666"/>
<text x="1218" y="325" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Shutdown</text>
<text x="1218" y="343" font-family="Helvetica,Arial,sans-serif" font-size="11">SIGTERM or SIGINT closes the server and</text>
<text x="1218" y="357" font-family="Helvetica,Arial,sans-serif" font-size="11">the pool; after 10 s without finishing</text>
<text x="1218" y="371" font-family="Helvetica,Arial,sans-serif" font-size="11">it exits with an error.</text>
<text x="1218" y="387" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">backend/src/shutdown.ts &gt;</text>
<text x="1218" y="400" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">DEFAULT_SHUTDOWN_TIMEOUT_MS</text>
<text x="1218" y="415" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="1210" y="462" width="260" height="122" rx="8" fill="#f5f5f5" stroke="#666666"/>
<text x="1218" y="480" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Logs</text>
<text x="1218" y="498" font-family="Helvetica,Arial,sans-serif" font-size="11">Nest logger with a configurable level;</text>
<text x="1218" y="512" font-family="Helvetica,Arial,sans-serif" font-size="11">the database URL is logged without its</text>
<text x="1218" y="526" font-family="Helvetica,Arial,sans-serif" font-size="11">password.</text>
<text x="1218" y="542" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">backend/src/config/redact.ts &gt; redact</text>
<text x="1218" y="557" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
