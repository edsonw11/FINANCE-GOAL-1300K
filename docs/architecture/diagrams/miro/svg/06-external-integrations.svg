<rect x="315.1" y="590" width="99.80000000000001" height="14" rx="3" fill="#fff" stroke="#e2e8f0"/>
<text x="319.1" y="601" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">Capacitor plugins</text>
<path d="M300,777.5 L374,777.5 L374,637.5 L430,637.5" fill="none" stroke="#d79b00" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="329.5" y="760.5" width="89" height="14" rx="3" fill="#fff" stroke="#e2e8f0"/>
<text x="333.5" y="771.5" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">HTTPS multipart</text>
<path d="M300,926 L383,926 L383,772 L430,772" fill="none" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
<rect x="352" y="909" width="62" height="14" rx="3" fill="#fff" stroke="#e2e8f0"/>
<text x="356" y="920" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">local file</text>
<rect x="20" y="1024" width="150" height="26" rx="5" fill="#e1d5e7" stroke="#9673a6"/>
<text x="26" y="1041" font-family="Helvetica,Arial,sans-serif" font-size="10">Orchestration and services</text>
<rect x="180" y="1024" width="150" height="26" rx="5" fill="#ffe6cc" stroke="#d79b00"/>
<text x="186" y="1041" font-family="Helvetica,Arial,sans-serif" font-size="10">External integrations</text>
<rect x="340" y="1024" width="150" height="26" rx="5" fill="#f8cecc" stroke="#b85450"/>
<text x="346" y="1041" font-family="Helvetica,Arial,sans-serif" font-size="10">Errors and attention points</text>
<text x="20" y="1072" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555">Status values: IMPLEMENTED | PARTIAL | NOT CONFIRMED | NOT IDENTIFIED | LEGACY | PROPOSAL | MOCK. Colours are a convention, not an implementation status.</text>
<text x="20" y="1094" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555">GitHub Actions (.github/workflows/ci.yml) runs the checks and builds the debug APK; it is not called by the running app.</text></svg>
