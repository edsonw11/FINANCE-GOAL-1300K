<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="898" viewBox="0 0 1300 898"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a5568"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="20" y="32" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold">Everfox: Sequence of a Sync Run</text>
<text x="20" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555">Every request passes the global guards first. A mutation already seen gets its first answer again and changes nothing.</text>
<rect x="20" y="96" width="150" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="95" y="120" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Browser sync runner</text>
<line x1="95" y1="136" x2="95" y2="804" stroke="#999" stroke-dasharray="4 3"/>
<rect x="230" y="96" width="150" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="305" y="120" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Global guards</text>
<line x1="305" y1="136" x2="305" y2="804" stroke="#999" stroke-dasharray="4 3"/>
<rect x="440" y="96" width="150" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="515" y="120" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SyncController</text>
<line x1="515" y1="136" x2="515" y2="804" stroke="#999" stroke-dasharray="4 3"/>
<rect x="650" y="96" width="150" height="40" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
<text x="725" y="120" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SyncService</text>
<line x1="725" y1="136" x2="725" y2="804" stroke="#999" stroke-dasharray="4 3"/>
<rect x="860" y="96" width="150" height="40" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
<text x="935" y="120" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SyncResource (per kind)</text>
<line x1="935" y1="136" x2="935" y2="804" stroke="#999" stroke-dasharray="4 3"/>
<rect x="1070" y="96" width="150" height="40" rx="6" fill="#f5f5f5" stroke="#666666"/>
<text x="1145" y="120" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PostgreSQL</text>
<line x1="1145" y1="136" x2="1145" y2="804" stroke="#999" stroke-dasharray="4 3"/>
<line x1="95" y1="186" x2="305" y2="186" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="101" y="181" font-family="Helvetica,Arial,sans-serif" font-size="10">1. POST /api/v1/sync/push (cookie, origin, CSRF header)</text>
<line x1="305" y1="232" x2="515" y2="232" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="311" y="227" font-family="Helvetica,Arial,sans-serif" font-size="10">2. rate limit, CSRF, login ok</text>
<line x1="515" y1="278" x2="725" y2="278" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="521" y="273" font-family="Helvetica,Arial,sans-serif" font-size="10">3. push(userId, mutations)</text>
<line x1="725" y1="324" x2="1145" y2="324" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="731" y="319" font-family="Helvetica,Arial,sans-serif" font-size="10">4. find the mutation id in the log</text>
<line x1="725" y1="370" x2="935" y2="370" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="731" y="365" font-family="Helvetica,Arial,sans-serif" font-size="10">5. put / remove, if not seen</text>
<line x1="935" y1="416" x2="1145" y2="416" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="941" y="411" font-family="Helvetica,Arial,sans-serif" font-size="10">6. write the record with a new version</text>
<line x1="725" y1="462" x2="1145" y2="462" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="731" y="457" font-family="Helvetica,Arial,sans-serif" font-size="10">7. record the outcome</text>
<line x1="725" y1="508" x2="95" y2="508" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
<text x="101" y="503" font-family="Helvetica,Arial,sans-serif" font-size="10">8. per mutation: applied, superseded, rejected or skipped</text>
<line x1="95" y1="554" x2="515" y2="554" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="101" y="549" font-family="Helvetica,Arial,sans-serif" font-size="10">9. GET /api/v1/sync/changes?cursor</text>
<line x1="515" y1="600" x2="725" y2="600" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="521" y="595" font-family="Helvetica,Arial,sans-serif" font-size="10">10. changes(userId, cursor, limit)</text>
<line x1="725" y1="646" x2="935" y2="646" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="731" y="641" font-family="Helvetica,Arial,sans-serif" font-size="10">11. changesSince(version) of every resource</text>
<line x1="725" y1="692" x2="95" y2="692" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
<text x="101" y="687" font-family="Helvetica,Arial,sans-serif" font-size="10">12. changes in version order, new cursor, hasMore</text>
<line x1="305" y1="738" x2="95" y2="738" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
<text x="101" y="733" font-family="Helvetica,Arial,sans-serif" font-size="10">13. 401 login / 403 CSRF / 429 too many requests</text>
<rect x="20" y="828" width="150" height="26" rx="5" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="26" y="845" font-family="Helvetica,Arial,sans-serif" font-size="10">API and entry</text>
<rect x="180" y="828" width="150" height="26" rx="5" fill="#e1d5e7" stroke="#9673a6"/>
<text x="186" y="845" font-family="Helvetica,Arial,sans-serif" font-size="10">Orchestration and services</text>
<rect x="340" y="828" width="150" height="26" rx="5" fill="#f5f5f5" stroke="#666666"/>
<text x="346" y="845" font-family="Helvetica,Arial,sans-serif" font-size="10">Infrastructure</text>
<text x="20" y="876" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555">Status values: IMPLEMENTED | PARTIAL | NOT CONFIRMED | NOT IDENTIFIED | LEGACY | PROPOSAL | MOCK. Colours are a convention, not an implementation status.</text></svg>
