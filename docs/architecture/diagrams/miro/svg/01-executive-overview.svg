<text x="950" y="119" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. Outputs</text>
<rect x="820" y="152" width="260" height="122" rx="8" fill="#ffffff" stroke="#333333"/>
<text x="828" y="170" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Screens</text>
<text x="828" y="188" font-family="Helvetica,Arial,sans-serif" font-size="11">Numbers, charts and lists: Summary,</text>
<text x="828" y="202" font-family="Helvetica,Arial,sans-serif" font-size="11">Lançamentos, Cartão, Patrimônio,</text>
<text x="828" y="216" font-family="Helvetica,Arial,sans-serif" font-size="11">Análise, Categorias, Ajustes.</text>
<text x="828" y="232" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">src/ui/render.js &gt; render</text>
<text x="828" y="247" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="820" y="294" width="260" height="121" rx="8" fill="#ffffff" stroke="#333333"/>
<text x="828" y="312" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Monthly report</text>
<text x="828" y="330" font-family="Helvetica,Arial,sans-serif" font-size="11">Printed or saved as PDF by the browser,</text>
<text x="828" y="344" font-family="Helvetica,Arial,sans-serif" font-size="11">or sent as an e-mail summary.</text>
<text x="828" y="360" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">src/ui/views/report-print.js &gt;</text>
<text x="828" y="373" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">renderReport</text>
<text x="828" y="388" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="820" y="435" width="260" height="108" rx="8" fill="#ffffff" stroke="#333333"/>
<text x="828" y="453" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Backup file</text>
<text x="828" y="471" font-family="Helvetica,Arial,sans-serif" font-size="11">JSON saved by the browser, or shared</text>
<text x="828" y="485" font-family="Helvetica,Arial,sans-serif" font-size="11">through the Android share sheet.</text>
<text x="828" y="501" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">src/ui/native-bridge.js &gt; shareTextFile</text>
<text x="828" y="516" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
