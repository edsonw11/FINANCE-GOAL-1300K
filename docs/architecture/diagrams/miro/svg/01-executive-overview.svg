<text x="828" y="599" font-family="Helvetica,Arial,sans-serif" font-size="11">The same app inside a Capacitor shell:</text>
<text x="828" y="613" font-family="Helvetica,Arial,sans-serif" font-size="11">offline, with an app lock (fingerprint</text>
<text x="828" y="627" font-family="Helvetica,Arial,sans-serif" font-size="11">or phone PIN).</text>
<text x="828" y="643" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">android/app/src/main/java/com/everfox/</text>
