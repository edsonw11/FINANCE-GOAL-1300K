<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1317" viewBox="0 0 1120 1317"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a5568"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="20" y="32" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold">Everfox: System Overview</text>
<text x="20" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555">Personal finance app: follow a net-worth goal (default R$ 1,300,000), monthly cash flow, credit card invoices and investments. Works offline in the browser and in an Android app; cloud sync</text>
<text x="20" y="69" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555">is optional (web only).</text>
<rect x="20" y="96" width="300" height="480" fill="#fff" stroke="#9aa4b2"/><rect x="20" y="96" width="300" height="36" fill="#f8f9fb" stroke="#9aa4b2"/>
<text x="170" y="119" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. Inputs</text>
<rect x="40" y="152" width="260" height="135" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="48" y="170" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Manual entry</text>
<text x="48" y="188" font-family="Helvetica,Arial,sans-serif" font-size="11">The + button form, or one short</text>
<text x="48" y="202" font-family="Helvetica,Arial,sans-serif" font-size="11">Portuguese sentence such as &quot;Gastei</text>
<text x="48" y="216" font-family="Helvetica,Arial,sans-serif" font-size="11">85,90 no mercado hoje&quot;.</text>
<text x="48" y="232" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">src/domain/quick-entry.js &gt;</text>
<text x="48" y="245" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">parseQuickEntry</text>
<text x="48" y="260" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="40" y="307" width="260" height="121" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="48" y="325" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Bank files</text>
<text x="48" y="343" font-family="Helvetica,Arial,sans-serif" font-size="11">OFX, CSV and digital PDF (statements and</text>
<text x="48" y="357" font-family="Helvetica,Arial,sans-serif" font-size="11">card invoices); B3 brokerage notes.</text>
<text x="48" y="373" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">src/domain/import-reader.js &gt;</text>
<text x="48" y="386" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">readImportFile</text>
<text x="48" y="401" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="40" y="448" width="260" height="108" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="48" y="466" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Backup file</text>
<text x="48" y="484" font-family="Helvetica,Arial,sans-serif" font-size="11">A JSON file exported earlier is</text>
<text x="48" y="498" font-family="Helvetica,Arial,sans-serif" font-size="11">restored.</text>
<text x="48" y="514" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">src/ui/views/backup.js &gt; bindBackup</text>
<text x="48" y="529" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="410" y="96" width="300" height="340" fill="#fff" stroke="#9aa4b2"/><rect x="410" y="96" width="300" height="36" fill="#f8f9fb" stroke="#9aa4b2"/>
<text x="560" y="119" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. Everfox app (on the device)</text>
<rect x="430" y="152" width="260" height="122" rx="8" fill="#d5e8d4" stroke="#82b366"/>
<text x="438" y="170" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Rules</text>
<text x="438" y="188" font-family="Helvetica,Arial,sans-serif" font-size="11">Month result, card invoices, goal</text>
<text x="438" y="202" font-family="Helvetica,Arial,sans-serif" font-size="11">projection, portfolio, budgets,</text>
<text x="438" y="216" font-family="Helvetica,Arial,sans-serif" font-size="11">emergency reserve.</text>
<text x="438" y="232" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">src/domain/month-result.js &gt; monthResult</text>
<text x="438" y="247" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
<rect x="430" y="294" width="260" height="122" rx="8" fill="#d5e8d4" stroke="#82b366"/>
<text x="438" y="312" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Local state</text>
<text x="438" y="330" font-family="Helvetica,Arial,sans-serif" font-size="11">One JSON in the browser storage (key</text>
<text x="438" y="344" font-family="Helvetica,Arial,sans-serif" font-size="11">metaapp.v2) with an automatic copy of</text>
<text x="438" y="358" font-family="Helvetica,Arial,sans-serif" font-size="11">the previous day.</text>
<text x="438" y="374" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666">src/domain/store.js &gt; transact</text>
<text x="438" y="389" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Status: IMPLEMENTED</text>
