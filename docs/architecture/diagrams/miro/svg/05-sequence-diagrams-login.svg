<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="916" viewBox="0 0 1300 916"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a5568"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="20" y="32" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold">Everfox: Sequence of Logging In (OpenID Connect)</text>
<text x="20" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555">Code flow with a one-time login attempt tied to a short cookie; the session cookie holds a random value, the database only its hash.</text>
<rect x="20" y="96" width="150" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="95" y="120" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Browser</text>
<line x1="95" y1="136" x2="95" y2="804" stroke="#999" stroke-dasharray="4 3"/>
<rect x="230" y="96" width="150" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="305" y="120" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AuthController</text>
<line x1="305" y1="136" x2="305" y2="804" stroke="#999" stroke-dasharray="4 3"/>
<rect x="440" y="96" width="150" height="40" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
<text x="515" y="120" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LoginService</text>
<line x1="515" y1="136" x2="515" y2="804" stroke="#999" stroke-dasharray="4 3"/>
<rect x="650" y="96" width="150" height="40" rx="6" fill="#f5f5f5" stroke="#666666"/>
<text x="725" y="120" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AuthFlowRepository</text>
<line x1="725" y1="136" x2="725" y2="804" stroke="#999" stroke-dasharray="4 3"/>
<rect x="860" y="96" width="150" height="40" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
<text x="935" y="120" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Keycloak</text>
<line x1="935" y1="136" x2="935" y2="804" stroke="#999" stroke-dasharray="4 3"/>
<rect x="1070" y="96" width="150" height="40" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
<text x="1145" y="120" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SessionService</text>
<line x1="1145" y1="136" x2="1145" y2="804" stroke="#999" stroke-dasharray="4 3"/>
<line x1="95" y1="186" x2="305" y2="186" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="101" y="181" font-family="Helvetica,Arial,sans-serif" font-size="10">1. GET /auth/login?returnTo</text>
<line x1="305" y1="232" x2="515" y2="232" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="311" y="227" font-family="Helvetica,Arial,sans-serif" font-size="10">2. begin(returnTo)</text>
<line x1="515" y1="278" x2="935" y2="278" stroke="#d79b00" stroke-width="1.5" marker-end="url(#a)"/>
<text x="521" y="273" font-family="Helvetica,Arial,sans-serif" font-size="10">3. createAuthorizationRequest (state, nonce, PKCE verifier)</text>
<line x1="515" y1="324" x2="725" y2="324" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="521" y="319" font-family="Helvetica,Arial,sans-serif" font-size="10">4. insert the attempt (hashed id), delete expired</text>
<line x1="305" y1="370" x2="95" y2="370" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
<text x="101" y="365" font-family="Helvetica,Arial,sans-serif" font-size="10">5. 302 to Keycloak, login cookie set</text>
<line x1="95" y1="416" x2="935" y2="416" stroke="#d79b00" stroke-width="1.5" marker-end="url(#a)"/>
<text x="101" y="411" font-family="Helvetica,Arial,sans-serif" font-size="10">6. person signs in</text>
<line x1="95" y1="462" x2="305" y2="462" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="101" y="457" font-family="Helvetica,Arial,sans-serif" font-size="10">7. GET /auth/callback?code</text>
<line x1="305" y1="508" x2="515" y2="508" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="311" y="503" font-family="Helvetica,Arial,sans-serif" font-size="10">8. complete(cookie, callback url)</text>
<line x1="515" y1="554" x2="725" y2="554" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="521" y="549" font-family="Helvetica,Arial,sans-serif" font-size="10">9. consume the attempt (once)</text>
<line x1="515" y1="600" x2="935" y2="600" stroke="#d79b00" stroke-width="1.5" marker-end="url(#a)"/>
<text x="521" y="595" font-family="Helvetica,Arial,sans-serif" font-size="10">10. completeLogin: exchange the code</text>
<line x1="515" y1="646" x2="1145" y2="646" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="521" y="641" font-family="Helvetica,Arial,sans-serif" font-size="10">11. create(userId): random token, store its hash</text>
<line x1="305" y1="692" x2="95" y2="692" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
<text x="101" y="687" font-family="Helvetica,Arial,sans-serif" font-size="10">12. 302 to returnTo, session cookie set</text>
<line x1="305" y1="738" x2="95" y2="738" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
<text x="101" y="733" font-family="Helvetica,Arial,sans-serif" font-size="10">13. LoginFailedError: login cookie cleared, redirect to the login-failed page, no session</text>
<rect x="20" y="828" width="150" height="26" rx="5" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="26" y="845" font-family="Helvetica,Arial,sans-serif" font-size="10">API and entry</text>
<rect x="180" y="828" width="150" height="26" rx="5" fill="#e1d5e7" stroke="#9673a6"/>
<text x="186" y="845" font-family="Helvetica,Arial,sans-serif" font-size="10">Orchestration and services</text>
<rect x="340" y="828" width="150" height="26" rx="5" fill="#f5f5f5" stroke="#666666"/>
<text x="346" y="845" font-family="Helvetica,Arial,sans-serif" font-size="10">Infrastructure</text>
<rect x="500" y="828" width="150" height="26" rx="5" fill="#ffe6cc" stroke="#d79b00"/>
<text x="506" y="845" font-family="Helvetica,Arial,sans-serif" font-size="10">External integrations</text>
<text x="20" y="876" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555">Status values: IMPLEMENTED | PARTIAL | NOT CONFIRMED | NOT IDENTIFIED | LEGACY | PROPOSAL | MOCK. Colours are a convention, not an implementation status.</text>
<text x="20" y="898" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555">Messages 6 and 10 are drawn as external calls. The last message shows the failure path (LoginFailedError).</text></svg>
