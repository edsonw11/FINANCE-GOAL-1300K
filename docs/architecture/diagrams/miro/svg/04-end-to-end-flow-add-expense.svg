<rect x="20" y="546" width="150" height="26" rx="5" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="26" y="563" font-family="Helvetica,Arial,sans-serif" font-size="10">API and entry</text>
<rect x="180" y="546" width="150" height="26" rx="5" fill="#fff2cc" stroke="#d6b656"/>
<text x="186" y="563" font-family="Helvetica,Arial,sans-serif" font-size="10">Decisions and validations</text>
<rect x="340" y="546" width="150" height="26" rx="5" fill="#f8cecc" stroke="#b85450"/>
<text x="346" y="563" font-family="Helvetica,Arial,sans-serif" font-size="10">Errors and attention points</text>
<rect x="500" y="546" width="150" height="26" rx="5" fill="#d5e8d4" stroke="#82b366"/>
<text x="506" y="563" font-family="Helvetica,Arial,sans-serif" font-size="10">Processing and domain rules</text>
