<text x="666" y="563" font-family="Helvetica,Arial,sans-serif" font-size="10">Results and outputs</text>
<text x="20" y="594" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555">Status values: IMPLEMENTED | PARTIAL | NOT CONFIRMED | NOT IDENTIFIED | LEGACY | PROPOSAL | MOCK. Colours are a convention, not an implementation status.</text></svg>
