# Local stack: PostgreSQL, the migrations and the API.
#   docker compose up -d db          only the database (for `npm run test:integration` in backend/)
#   docker compose up --build        database + migrations + API
# Everything listens on 127.0.0.1 only. The default password is for this machine only: the API refuses it in production.
name: everfox

services:
  db:
    image: postgres:18.7-alpine3.24
    environment:
      POSTGRES_USER: everfox
      POSTGRES_DB: everfox
      POSTGRES_PASSWORD: ${DB_PASSWORD:-everfox_dev_only}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everfox -d everfox"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      DATABASE_URL: postgresql://everfox:${DB_PASSWORD:-everfox_dev_only}@db:5432/everfox
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql://everfox:${DB_PASSWORD:-everfox_dev_only}@db:5432/everfox
      NODE_ENV: ${API_NODE_ENV:-development}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  db-data:
